<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>800PowerBat Invoice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#e9edf2;
    font-family:Arial,Helvetica,sans-serif;
    color:#071426;
}

/* =========================================================
FORM
========================================================= */

.form-area{
    max-width:1000px;
    margin:25px auto;
    padding:20px;
}

.form-card{
    background:#fff;
    padding:25px;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.form-card h2{
    margin:0 0 20px;
}

.form-card h2 span{
    color:#f5b400;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    padding:12px;
    border:1px solid #d4d9df;
    border-radius:7px;
    font-size:14px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus{
    border-color:#f5b400;
}

/* AUTO BATTERY INFO */

.battery-info{
    grid-column:1 / -1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:15px;
    background:#f7f8fa;
    border-left:5px solid #f5b400;
    border-radius:8px;
}

.info-box{
    background:#fff;
    border:1px solid #e1e5ea;
    border-radius:7px;
    padding:10px;
}

.info-box small{
    display:block;
    color:#68717c;
    font-size:11px;
    margin-bottom:4px;
}

.info-box strong{
    font-size:14px;
}

.sale-note{
    grid-column:1 / -1;
    background:#fff8dc;
    border-left:4px solid #f5b400;
    padding:10px 12px;
    font-size:12px;
    color:#665000;
    border-radius:5px;
}

.vat-box{
    margin-top:20px;
    padding:18px;
    background:#f7f8fa;
    border-left:5px solid #f5b400;
    border-radius:8px;
}

.vat-box h3{
    margin:0 0 12px;
    font-size:16px;
}

.vat-note{
    margin-top:8px;
    font-size:11px;
    color:#68717c;
    line-height:1.5;
}

.check-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.check-row input{
    width:18px;
    height:18px;
}

.buttons{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

button,
.btn{
    border:0;
    padding:13px 20px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
}

.generate{
    background:#f5b400;
    color:#071426;
}

.print{
    background:#071426;
    color:#fff;
}

.history{
    background:#e8ebef;
    color:#071426;
}

/* STOCK MESSAGE */

.stock-message{
    display:none;
    margin-top:15px;
    padding:12px 15px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.stock-success{
    background:#dff7e5;
    color:#176b2c;
    border-left:4px solid #20a044;
}

.stock-warning{
    background:#fff1cc;
    color:#805d00;
    border-left:4px solid #f5b400;
}

.stock-error{
    background:#ffe0e0;
    color:#9b1c1c;
    border-left:4px solid #d93025;
}

/* =========================================================
A4 INVOICE
========================================================= */

.invoice-wrapper{
    display:none;
    width:210mm;
    height:297mm;
    margin:30px auto;
    background:#0b1220;
    color:#fff;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 50px rgba(0,0,0,.30);

    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
}

/* HEADER */

.invoice-header{
    height:140px;
    background:#05080d;
    color:#fff;
    padding:17px 38px 13px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    border-bottom:1px solid #202b3a;
}

.brand-area{
    display:flex;
    flex-direction:column;
}

.logo-row{
    display:flex;
    align-items:center;
    gap:11px;
}

.battery-logo{
    width:61px;
    height:41px;
    background:#f5b400;
    border:3px solid #05080d;
    border-radius:6px;
    position:relative;
    box-shadow:0 0 0 1px #f5b400;
}

.battery-logo:before{
    content:"";
    position:absolute;
    width:14px;
    height:5px;
    background:#f5b400;
    top:-8px;
    left:9px;
    border-radius:2px;
    box-shadow:26px 0 #f5b400;
}

.battery-yellow{
    position:absolute;
    inset:4px;
    border:2px solid #071426;
    border-radius:3px;
}

.battery-bolt{
    position:absolute;
    color:#071426;
    font-size:27px;
    font-weight:900;
    left:20px;
    top:4px;
    line-height:1;
}

.brand-name{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.8px;
    line-height:1;
}

.brand-name .eight{
    color:#fff;
}

.brand-name .power{
    color:#f5b400;
}

.brand-sub{
    margin-top:5px;
    margin-left:73px;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1.8px;
    color:#d9e0e9;
}

.brand-sub:before,
.brand-sub:after{
    content:"";
    display:inline-block;
    width:20px;
    height:2px;
    background:#f5b400;
    vertical-align:middle;
    margin:0 4px;
}

.company-info{
    margin-top:12px;
    display:flex;
    gap:17px;
    font-size:9px;
    line-height:1.3;
    color:#c6ced9;
}

.info-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.info-icon{
    width:16px;
    height:16px;
    border:1px solid #f5b400;
    color:#f5b400;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:5px;
    font-weight:bold;
}

.invoice-right{
    text-align:right;
    min-width:245px;
    padding-top:1px;
}

.invoice-right h1{
    display:inline-block;
    background:#071426;
    color:#f5b400;
    border:2px solid #f5b400;
    padding:6px 14px;
    margin:0 0 6px;
    font-size:20px;
    letter-spacing:1.5px;
    border-radius:3px;
}

.invoice-meta{
    font-size:10px;
    line-height:1.6;
    color:#aeb8c6;
}

.invoice-meta strong{
    margin-left:5px;
    color:#fff;
}

.yellow-line{
    height:3px;
    background:#f5b400;
}

/* BILL */

.bill-section{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    padding:15px 38px 13px;
}

.bill-title{
    color:#f5b400;
    font-weight:800;
    font-size:9px;
    margin-bottom:5px;
    letter-spacing:1.2px;
}

.bill-name{
    font-size:16px;
    font-weight:800;
    color:#fff;
}

.bill-text{
    font-size:10px;
    margin-top:4px;
    color:#b3bdca;
}

/* TABLE */

.table-area{
    padding:0 38px;
}

.invoice-table{
    width:100%;
    border-collapse:collapse;
    border:1px solid #28364a;
}

.invoice-table thead{
    background:#f5b400;
    color:#071426;
}

.invoice-table th{
    padding:9px 12px;
    text-align:left;
    font-size:10px;
    font-weight:900;
    letter-spacing:.5px;
}

.invoice-table th:nth-child(2),
.invoice-table td:nth-child(2){
    text-align:center;
    width:12%;
}

.invoice-table th:last-child,
.invoice-table td:last-child{
    text-align:right;
    width:22%;
}

.invoice-table td{
    padding:11px 12px;
    border-bottom:1px solid #28364a;
    background:#101a2a;
    color:#fff;
    font-size:10px;
}

.invoice-table tr:last-child td{
    border-bottom:0;
}

.item-brand{
    font-size:13px;
    font-weight:bold;
    color:#f5b400;
}

.item-model{
    margin-top:4px;
    font-size:11px;
    color:#fff;
}

.item-details{
    margin-top:5px;
    font-size:9px;
    color:#929eaf;
}

.item-warranty{
    margin-top:4px;
    font-size:9px;
    font-weight:bold;
    color:#929eaf;
}

.item-warranty span{
    color:#f5b400;
}

/* TOTALS */

.bottom-section{
    display:flex;
    justify-content:flex-end;
    padding:13px 38px;
}

.totals{
    width:280px;
    background:#101a2a;
    border:1px solid #28364a;
    border-radius:5px;
    padding:10px 14px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    font-size:10px;
    color:#aeb8c6;
}

.total-row strong{
    color:#fff;
}

.total-line{
    height:1px;
    background:#f5b400;
    margin:5px 0 7px;
}

.total-main{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:900;
    padding:3px 0;
    color:#fff;
}

.total-main span:last-child{
    color:#f5b400;
}

.payment-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:10px;
    margin-top:8px;
    color:#aeb8c6;
}

.payment-method{
    margin-top:5px;
    display:flex;
    justify-content:space-between;
    font-size:9px;
    color:#8f9bad;
}

.payment-method strong{
    color:#fff;
}

.paid{
    background:#9ef0aa;
    color:#075d22;
    padding:4px 10px;
    border-radius:20px;
    font-size:9px;
    font-weight:bold;
}

.pending{
    background:#ffd982;
    color:#684700;
    padding:4px 10px;
    border-radius:20px;
    font-size:9px;
    font-weight:bold;
}

/* WARRANTY */

.warranty{
    margin:0 38px 12px;
    padding:12px 15px;
    background:#101a2a;
    border:1px solid #28364a;
    border-left:4px solid #f5b400;
    border-radius:5px;
}

.warranty-title{
    font-size:12px;
    font-weight:bold;
    color:#fff;
    margin-bottom:6px;
}

.warranty-text{
    color:#aeb8c6;
    font-size:9.5px;
    line-height:1.48;
}

.warranty-text strong{
    color:#e4e9ef;
}

/* THANK YOU */

.thank-you{
    border-top:1px solid #28364a;
    margin:0 38px;
    text-align:center;
    padding:12px 10px 14px;
}

.thank-you h2{
    margin:0 0 5px;
    font-size:15px;
    color:#fff;
}

.thank-you p{
    margin:3px 0;
    color:#909daf;
    font-size:9px;
}

/* FOOTER */

.invoice-footer{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    background:#05080d;
    color:#fff;
    display:flex;
    align-items:center;
    padding:11px 38px;
    overflow:hidden;
    border-top:1px solid #202b3a;
}

.invoice-footer:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:72%;
    height:3px;
    background:#f5b400;
}

.invoice-footer:after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:3px;
    background:#f5b400;
}

.services{
    display:flex;
    gap:20px;
    align-items:center;
    width:58%;
}

.service{
    text-align:center;
    width:65px;
}

.service-icon{
    width:29px;
    height:29px;
    border:1px solid #f5b400;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.service span{
    display:block;
    margin-top:3px;
    font-size:7px;
    font-weight:bold;
    line-height:1.15;
    color:#d4dbe5;
}

.slogan{
    border-left:1px solid #f5b400;
    padding-left:17px;
    margin-left:auto;
    width:38%;
}

.slogan-script{
    color:#f5b400;
    font-family:cursive;
    font-size:16px;
    margin-bottom:4px;
}

.slogan-small{
    font-size:7px;
    letter-spacing:1.8px;
    font-weight:bold;
    color:#c2cad5;
}

/* PRINT */

@media print{

    html,
    body{
        width:210mm;
        height:297mm;
        margin:0;
        padding:0;
        background:#0b1220 !important;
    }

    body{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    .no-print{
        display:none!important;
    }

    .invoice-wrapper{
        display:block!important;
        width:210mm;
        height:297mm;
        min-height:297mm;
        margin:0!important;
        box-shadow:none!important;
        overflow:hidden!important;
        background:#0b1220!important;

        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    @page{
        size:A4;
        margin:0;
    }
}

/* MOBILE */

@media(max-width:750px){

    .grid{
        grid-template-columns:1fr;
    }

    .battery-info{
        grid-template-columns:1fr 1fr;
    }

    .invoice-wrapper{
        width:100%;
        height:auto;
        min-height:900px;
        margin:20px auto;
    }

    .invoice-header{
        height:auto;
        padding:18px 20px;
        flex-direction:column;
    }

    .brand-name{
        font-size:30px;
    }

    .company-info{
        flex-direction:column;
        gap:5px;
    }

    .invoice-right{
        text-align:left;
        min-width:0;
        margin-top:15px;
    }

    .invoice-right h1{
        font-size:21px;
    }

    .bill-section{
        padding:13px 20px;
        gap:15px;
    }

    .table-area{
        padding:0 20px;
        overflow-x:auto;
    }

    .invoice-table{
        min-width:500px;
    }

    .bottom-section{
        padding:11px 20px;
    }

    .totals{
        width:100%;
    }

    .warranty{
        margin:0 20px 12px;
    }

    .thank-you{
        margin:0 20px;
    }

    .invoice-footer{
        position:relative;
        height:auto;
        min-height:140px;
        padding:18px 20px;
        flex-direction:column;
        align-items:flex-start;
    }

    .services{
        width:100%;
        justify-content:space-between;
        gap:4px;
    }

    .slogan{
        width:100%;
        margin:13px 0 0;
        padding-left:13px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
FORM
======================================================= -->

<div class="form-area no-print">

<div class="form-card">

<h2>Create <span>800PowerBat</span> Invoice</h2>

<div class="grid">

<div class="field">
<label>Customer Name</label>
<input id="customer" placeholder="Customer name">
</div>

<div class="field">
<label>Customer Phone</label>
<input id="phone" placeholder="+971...">
</div>

<div class="field">
<label>Customer TRN (Optional)</label>
<input id="customerTRN" placeholder="Customer TRN if provided">
</div>

<div class="field">
<label>Car Brand</label>
<input id="carBrand" placeholder="BMW">
</div>

<div class="field">
<label>Car Model</label>
<input id="carModel" placeholder="X5">
</div>


<!-- BATTERY BRAND FROM STOCK -->

<div class="field">
<label>Battery Brand</label>

<select id="batteryBrand" onchange="loadBatteryModels()">

<option value="">
Select Battery Brand
</option>

</select>

</div>


<!-- BATTERY MODEL FROM STOCK -->

<div class="field">
<label>Battery Model</label>

<select id="batteryModel" onchange="loadBatteryDetails()">

<option value="">
Select Battery Model
</option>

</select>

</div>


<!-- AUTO BATTERY DETAILS -->

<div class="battery-info">

<div class="info-box">
<small>Battery Type</small>
<strong id="selectedType">—</strong>
</div>

<div class="info-box">
<small>Ah</small>
<strong id="selectedAh">—</strong>
</div>

<div class="info-box">
<small>Size</small>
<strong id="selectedSize">—</strong>
</div>

<div class="info-box">
<small>Stock Available</small>
<strong id="selectedStock">—</strong>
</div>

<div class="info-box">
<small>Purchase Price</small>
<strong id="selectedPurchase">—</strong>
</div>

<div class="info-box">
<small>Warranty</small>
<strong id="selectedWarranty">—</strong>
</div>

<div class="sale-note">
<strong>Sale Price:</strong>
Enter your own customer selling price below.
The selling price is NOT saved in Battery Stock.
</div>

</div>


<div class="field">
<label>Battery Sale Price (AED)</label>

<input
id="batteryPrice"
type="number"
value="0"
min="0"
step="0.01"
placeholder="Enter your selling price"
>

</div>


<div class="field">
<label>Installation / Service (AED
