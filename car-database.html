<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#17202a;

.header{
    background:#101820;
    color:#fff;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:4px solid #f5b400;
}

.logo{
    font-size:26px;
    font-weight:900;
}

.logo span{
    color:#f5b400;
}

.header small{
    color:#cbd2da;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 18px;
    font-size:21px;
}

.card h2 span{
    color:#f5b400;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d6dbe0;
    border-radius:7px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#f5b400;
}

.buttons{

    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

button,
.link-btn{
    border:0;
    padding:12px 18px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
}

.save-btn{

    color:#101820;
}

.clear-btn{
    background:#e9edf1;
    color:#17202a;
}

.dashboard-btn{

}

.load-btn{

}

.search{

}

.search input{

.table-wrapper{

}

table{

}

thead{

th{

td{

tr:hover td{

.badge{

.edit-btn{

.stats{

.stat{

.stat small{

.stat strong{

.empty{

.info-box{

@media(max-width:700px){

/* =====================================================
YEARS 1975 - 2026
===================================================== */

const defaultYears = [];

for(
    let year = 1975;
    year <= 2026;
    year++
){

    defaultYears.push(year);

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

    return String(value || "")
    .trim()
    .toLowerCase();

}


/* =====================================================
CHECK DUPLICATE
===================================================== */

function carExists(
    brand,
    model,
    year
){

    return cars.some(function(item){

        return (

            normalize(item.brand)
            ===
            normalize(brand)

            &&

            normalize(item.model)
            ===
            normalize(model)

            &&

            Number(item.year)
            ===
            Number(year)

        );

    });

}


/* =====================================================
LOAD DEFAULT DATABASE
===================================================== */

function loadDefaultCars(){

    let added = 0;


    Object.keys(defaultCars)
    .forEach(function(brand){

        defaultCars[brand]
        .forEach(function(model){

            defaultYears
            .forEach(function(year){

                if(
                    !carExists(
                        brand,
                        model,
                        year
                    )
                ){

                    cars.push({

                        brand:brand,

                        model:model,

                        year:year

                    });

                    added++;

                }

            });

        });

    });


    localStorage.setItem(
        "800PowerBatCars",
        JSON.stringify(cars)
    );


    displayCars();

    updateStats();


    alert(
        added +
        " car records added successfully."
    );

}


/* =====================================================
SAVE CAR
===================================================== */

function saveCar(){

    const brand =
    document.getElementById(
        "carBrand"
    )
    .value
    .trim();


    const model =
    document.getElementById(
        "carModel"
    )
    .value
    .trim();


    const year =
    document.getElementById(
        "modelYear"
    )
    .value
    .trim();


    if(!brand){

        alert(
            "Please enter Car Brand."
        );

        return;

    }


    if(!model){

        alert(
            "Please enter Car Model."
        );

        return;

    }


    if(!year){

        alert(
            "Please enter Model Year."
        );

        return;

    }


    const yearNumber =
    Number(year);


    if(
        yearNumber < 1975 ||
        yearNumber > 2026
    ){

        alert(
            "Please enter a model year between 1975 and 2026."
        );

        return;

    }


    const carData = {

        brand:brand,

        model:model,

        year:yearNumber

    };


    /* EDIT */

    if(editIndex !== -1){

        const duplicate =
        cars.some(function(
            item,
            index
        ){

            if(
                index === editIndex
            ){

                return false;

            }


            return (

                normalize(item.brand)
                ===
                normalize(brand)

                &&

                normalize(item.model)
                ===
                normalize(model)

                &&

                Number(item.year)
                ===
                yearNumber

            );

        });


        if(duplicate){

            alert(
                "This car already exists in the database."
            );

            return;

        }


        cars[editIndex] =
        carData;


        editIndex = -1;

    }


    /* ADD */

    else{

        if(
            carExists(
                brand,
                model,
                yearNumber
            )
        ){

            alert(
                "This car already exists in the database."
            );

            return;

        }


        cars.push(
            carData
        );

    }


    localStorage.setItem(
        "800PowerBatCars",
        JSON.stringify(cars)
    );


    clearForm();

    displayCars();

    updateStats();

}


/* =====================================================
DISPLAY CARS
===================================================== */

function displayCars(){

    const table =
    document.getElementById(
        "carTable"
    );


    const search =
    document.getElementById(
        "search"
    )
    .value
    .toLowerCase()
    .trim();


    table.innerHTML = "";


    const filtered =
    cars.filter(function(item){

        return (

            String(
                item.brand || ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
                item.model || ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
                item.year || ""
            )
            .includes(search)

        );

    });


    if(
        filtered.length === 0
    ){

        table.innerHTML = `

        <tr>

        <td
        colspan="5"
        class="empty"
        >
        No cars found.
        </td>

        </tr>

        `;

        return;

    }


    filtered.forEach(
        function(item){

        const realIndex =
        cars.indexOf(item);


        const row =
        document.createElement(
            "tr"
        );


        row.innerHTML = `

        <td>
        ${realIndex + 1}
        </td>

        <td>
        <strong>
        ${escapeHTML(item.brand)}
        </strong>
        </td>

        <td>
        ${escapeHTML(item.model)}
        </td>

        <td>

        <span class="badge">
        ${item.year}
        </span>

        </td>

        <td>

        <button
        class="edit-btn"
        onclick="editCar(${realIndex})"
        >
        Edit
        </button>

        <button
        class="delete-btn"
        onclick="deleteCar(${realIndex})"
        >
        Delete
        </button>

        </td>

        `;


        table.appendChild(
            row
        );

    });

}


/* =====================================================
EDIT CAR
===================================================== */

function editCar(index){

    const car =
    cars[index];


    if(!car){

        return;

    }


    document.getElementById(
        "carBrand"
    ).value =
    car.brand;


    document.getElementById(
        "carModel"
    ).value =
    car.model;


    document.getElementById(
        "modelYear"
    ).value =
    car.year;


    editIndex =
    index;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
DELETE CAR
===================================================== */

function deleteCar(index){

    const car =
    cars[index];


    if(!car){

        return;

    }


    const confirmDelete =
    confirm(

        "Delete " +
        car.brand +
        " " +
        car.model +
        " " +
        car.year +
        " from Car Database?"

    );


    if(!confirmDelete){

        return;

    }


    cars.splice(
        index,
        1
    );


    localStorage.setItem(
        "800PowerBatCars",
        JSON.stringify(cars)
    );


    displayCars();

    updateStats();

}


/* =====================================================
CLEAR FORM
===================================================== */

function clearForm(){

    document.getElementById(
        "carBrand"
    ).value = "";


    document.getElementById(
        "carModel"
    ).value = "";


    document.getElementById(
        "modelYear"
    ).value = "";


    editIndex = -1;

}


/* =====================================================
UPDATE STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalCars"
    ).innerText =
    cars.length;


    const brands =
    new Set();


    const models =
    new Set();


    cars.forEach(function(item){

        brands.add(
            normalize(
                item.brand
            )
        );


        models.add(

            normalize(
                item.brand
            )

            +

            "||"

            +

            normalize(
                item.model
            )

        );

    });


    document.getElementById(
        "totalBrands"
    ).innerText =
    brands.size;


    document.getElementById(
        "totalModels"
    ).innerText =
    models.size;

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
START
===================================================== */

displayCars();

updateStats();


/* =====================================================
FIRST TIME DATABASE LOAD
===================================================== */

if(
    !localStorage.getItem(
        "800PowerBatCarDatabaseLoaded"
    )
){

    loadDefaultCars();

    localStorage.setItem(
        "800PowerBatCarDatabaseLoaded",
        "yes"
    );

}

</script>
