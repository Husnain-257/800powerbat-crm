<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice History | 800PowerBat</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#17202a;
}

header{
    background:#101820;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    color:#f5b400;
}

header p{
    margin:6px 0 0;
    color:#d0d5dd;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;
    outline:none;
}

.search:focus{
    border-color:#f5b400;
    box-shadow:0 0 0 3px rgba(245,180,0,.12);
}

.card{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border:1px solid #eaecf0;
}

.top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.invoice-number{
    font-weight:bold;
    color:#101820;
    font-size:16px;
}

.card p{
    margin:7px 0;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.paid{
    background:#e7f7ed;
    color:#168044;
}

.pending{
    background:#fff1d6;
    color:#9a6500;
}

button{
    border:0;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    background:#101820;
    color:white;
    width:100%;
    margin-top:10px;
}

.back:hover{
    background:#202b35;
}

.delete{
    background:#e74c3c;
    color:white;
    margin-top:10px;
}

.delete:hover{
    background:#c0392b;
}

.empty{
    text-align:center;
    padding:40px;
    background:white;
    border-radius:12px;
    border:1px solid #eaecf0;
}

.empty h2{
    margin-top:0;
}

@media(max-width:600px){

    .top{
        flex-direction:column;
    }

    .container{
        padding:15px;
    }

    header{
        padding:18px 15px;
    }

}

</style>
</head>

<body>

<header>

    <h1>800PowerBat</h1>

    <p>Invoice History</p>

</header>

<div class="container">

    <input
        type="text"
        class="search"
        id="search"
        placeholder="🔎 Search customer, phone or invoice..."
        oninput="showInvoices()"
    >

    <div id="invoiceList"></div>

    <button
        class="back"
        onclick="goDashboard()"
    >
        ← Back to Dashboard
    </button>

</div>

<script>

/* =========================================
   LOGIN SECURITY
========================================= */

const isLoggedIn =
    localStorage.getItem("800PowerBatLoggedIn");

const userRole =
    localStorage.getItem("800PowerBatUserRole") || "";


/*
   Only redirect when we are completely
   sure that the user is not logged in.
*/

if(
    isLoggedIn === null ||
    isLoggedIn === "" ||
    isLoggedIn === "false"
){

    window.location.replace("./login.html");

}


/* =========================================
   LOGGED-IN TECHNICIAN
========================================= */

const technicianName =
    localStorage.getItem(
        "800PowerBatTechnicianName"
    ) ||
    localStorage.getItem(
        "800PowerBatUsername"
    ) ||
    "Unknown Technician";


/* =========================================
   GET INVOICES
========================================= */

function getInvoices(){

    try{

        const saved =
            localStorage.getItem("invoices");

        if(!saved){
            return [];
        }

        const invoices =
            JSON.parse(saved);

        if(!Array.isArray(invoices)){
            return [];
        }

        return invoices;

    }catch(error){

        console.error(
            "Invoice data error:",
            error
        );

        return [];

    }

}


/* =========================================
   CHECK INVOICE OWNER
========================================= */

function invoiceBelongsToTechnician(invoice){

    const invoiceTechnician =
        invoice.technician ||
        invoice.technicianName ||
        invoice.createdBy ||
        "";

    return String(invoiceTechnician)
        .trim()
        .toLowerCase()
        ===
        String(technicianName)
        .trim()
        .toLowerCase();

}


/* =========================================
   SHOW INVOICES
========================================= */

function showInvoices(){

    let invoices =
        getInvoices();

    const searchInput =
        document.getElementById("search");

    const search =
        searchInput
        ? searchInput.value
            .toLowerCase()
            .trim()
        : "";

    /*
       ADMIN:
       Show all invoices.

       TECHNICIAN:
       Show only invoices created
       by logged-in technician.
    */

    if(userRole === "technician"){

        invoices =
            invoices.filter(
                function(invoice){

                    return invoiceBelongsToTechnician(
                        invoice
                    );

                }
            );

    }


    /* =====================================
       SEARCH
    ===================================== */

    const filtered =
        invoices.filter(
            function(invoice){

                const number =
                    String(
                        invoice.number || ""
                    ).toLowerCase();

                const customer =
                    String(
                        invoice.customer || ""
                    ).toLowerCase();

                const phone =
                    String(
                        invoice.phone || ""
                    ).toLowerCase();

                return (
                    number.includes(search) ||
                    customer.includes(search) ||
                    phone.includes(search)
                );

            }
        );


    const list =
        document.getElementById(
            "invoiceList"
        );


    if(!list){
        return;
    }


    /* =====================================
       NO INVOICES
    ===================================== */

    if(filtered.length === 0){

        list.innerHTML = `

            <div class="empty">

                <h2>No invoices found</h2>

                <p>
                    Your saved invoices will appear here.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    /* =====================================
       DISPLAY NEWEST FIRST
    ===================================== */

    filtered
        .slice()
        .reverse()
        .forEach(
            function(invoice){

                const payment =
                    String(
                        invoice.payment ||
                        invoice.status ||
                        "PENDING"
                    )
                    .trim()
                    .toUpperCase();


                const statusClass =
                    payment === "PAID"
                    ? "paid"
                    : "pending";


                const total =
                    Number(
                        invoice.total ||
                        invoice.amount ||
                        0
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                const invoiceNumber =
                    invoice.number || "—";

                const customer =
                    invoice.customer || "—";

                const phone =
                    invoice.phone || "—";

                const car =
                    invoice.car || "—";

                const date =
                    invoice.date || "—";


                card.innerHTML = `

                    <div class="top">

                        <div>

                            <div class="invoice-number">
                                ${escapeHTML(invoiceNumber)}
                            </div>

                            <p>
                                <strong>
                                    ${escapeHTML(customer)}
                                </strong>
                            </p>

                            <p>
                                ${escapeHTML(phone)}
                            </p>

                            <p>
                                ${escapeHTML(car)}
                            </p>

                            <small>
                                ${escapeHTML(date)}
                            </small>

                        </div>


                        <div>

                            <span class="status ${statusClass}">
                                ${escapeHTML(payment)}
                            </span>

                            <h2>
                                AED ${total.toFixed(2)}
                            </h2>

                        </div>

                    </div>


                    ${
                        userRole === "admin"
                        ?
                        `
                        <button
                            class="delete"
                            onclick="deleteInvoiceByNumber(
                                '${escapeJS(String(invoiceNumber))}'
                            )"
                        >
                            Delete
                        </button>
                        `
                        :
                        ""
                    }

                `;


                list.appendChild(card);

            }
        );

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   JAVASCRIPT STRING SECURITY
========================================= */

function escapeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");

}


/* =========================================
   DELETE INVOICE
   ADMIN ONLY
========================================= */

function deleteInvoiceByNumber(number){

    if(userRole !== "admin"){

        alert(
            "Only Administrator can delete invoices."
        );

        return;

    }


    if(
        !confirm(
            "Delete this invoice?"
        )
    ){

        return;

    }


    let invoices =
        getInvoices();


    invoices =
        invoices.filter(
            function(invoice){

                return String(
                    invoice.number || ""
                ) !== String(number);

            }
        );


    localStorage.setItem(
        "invoices",
        JSON.stringify(invoices)
    );


    showInvoices();

}


/* =========================================
   BACK TO DASHBOARD
========================================= */

function goDashboard(){

    window.location.href =
        "./index.html";

}


/* =========================================
   START
========================================= */

showInvoices();

</script>

</body>
</html>
